<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body id="contact">
    <header id="Wcontact">
        <h1>Contact Me</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div>
            <div class="contacthead">
                <h2>Get In Touch</h2>
            </div>
            <div class="contact1">
                <form action="#" method="post">
                    <fieldset>
                        <legend>Contact information</legend>


                        <label for="name">Name</label>
                        <input type="text" name="Name" id="name" required>


                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" required>


                        <label for="phone">Phone Number</label>
                        <input type="tel" name="phone" id="phone" pattern="[0-9]{10}"
                            placeholder="0721234567" required>


                        <label for="message">Your Message</label><br>
                        <textarea name="message" id="message" rows="4" maxlength="100"
                            placeholder="Enter message..."></textarea><br>


                        <label for="hearaboutus">How did you hear about us</label><br>
                        <select name="hearaboutus" id="hearaboutus">
                            <option value="Facebook">Facebook</option>
                            <option value="Instagram">Instagram</option>
                            <option value="Youtube">Youtube</option>
                            <option value="From a friend">From a friend</option>
                            <option value="Google search">Google search</option>
                            <option value="Other">Other</option>
                        </select><br>

                        <label for="Book">Looking to book services</label>
                        <input type="checkbox" name="checkbox" id="Book">


                        <button id="button" type="submit">Send</button>
                    </fieldset>
                </form>
            </div>
        </div>
        <div class="push"></div>
    </main>

    <footer>
        <p>Email me at matshidiso.moshoeshoe@umuzi.org</p>
        <p>&copy;2026</p>
    </footer>
</body>

</html>
